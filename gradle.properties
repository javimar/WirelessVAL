# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library
android.nonTransitiveRClass=true
android.useAndroidX=true
android.enableJetifier=true
android.nonFinalResIds=true

# Sin esto el daemon cae con OutOfMemoryError en mergeExtDex: el valor por defecto son
# 512 MiB de heap y 384 de metaspace, insuficientes para AGP 9 + Kotlin 2.4 + D8/R8.
# 4 GB es lo mismo que ya usa Swimmer; el metaspace se sube porque el compilador de
# Kotlin 2.x carga muchas mas clases que la generacion anterior.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8